<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>폐허의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body>
<script src="config.js"></script>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="rec"><span class="dot"></span>REC <span id="recTime">00:00:00</span><span id="sync"></span></div>
    <div id="areaName"></div>
    <div id="objective"></div>
  </div>
  <div class="hud-r">
    <button id="pastBtn" class="hbtn blue hidden"></button>
    <button id="fpBtn" class="hbtn">1인칭</button>
    <button id="arcBtn" class="hbtn">기록 보관함<span id="recCount"></span></button>
  </div>
</div>

<div id="dialog" class="hidden"><div id="dSpk"></div><div id="dTxt"></div><div id="dCh"></div><div id="dNext">▼</div></div>
<div id="toast"></div>
<div id="feed" class="hidden"></div>

<div id="touch">
  <div id="joyzone"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="btnRun" class="tbtn"><span>달리기<small id="runKey"></small></span></button>
  <button id="btnAct" class="tbtn">조사</button>
</div>

<div id="archive" class="ov hidden">
  <div class="arc-panel">
    <div class="arc-head">
      <div><div class="arc-sys">ARCHIVE SYSTEM · USER: UNKNOWN · STATUS: RECORDING</div><h2>기록 보관함</h2></div>
      <button class="x" id="arcClose">닫기</button>
    </div>
    <div class="tabs"><button data-tab="rec" class="on">기록</button><button data-tab="ded">추론</button></div>
    <div id="arcRec" class="arc-body">
      <div class="arc-left">
        <div class="cmpbar"><button id="cmpToggle">두 기록 비교</button><button id="cmpGo" class="hidden" disabled>비교하기</button><span id="cmpHint">서로 맞지 않는 두 기록을 찾으면 진실에 가까워진다.</span></div>
        <div id="arcList"></div>
      </div>
      <div id="arcDetail" class="arc-detail"></div>
    </div>
    <div id="arcDed" class="arc-ded hidden"></div>
    <div id="cmpResult" class="cmp-result hidden"></div>
  </div>
</div>

<div id="keypad" class="ov hidden">
  <div class="kp">
    <div class="kp-k" id="kpTitle">한결중학교 정문</div>
    <div class="kp-screen" id="kpScreen">____</div>
    <div class="kp-msg" id="kpMsg">학교에 마지막으로 사람이 있었던 날 (월일 4자리)</div>
    <div class="kp-grid" id="kpGrid"></div>
    <button id="kpClose">그만둔다</button>
  </div>
</div>

<div id="title" class="ov">
  <div class="t-in">
    <h1>폐허의 기록</h1>
    <p class="t-sub">도시는 죽었지만, 기록은 살아 있다.</p>
    <div class="t-btns" id="tBtns"><button id="btnNew">새로 기록하기</button><button id="btnCont" class="hidden">이어서 기록하기</button></div>
    <div class="acc" id="acc"></div>
    <p class="t-ctl" id="tCtl"></p>
    <p class="t-demo">구역 5곳 · 엔딩 4종</p>
  </div>
  <div class="t-seq hidden" id="tSeq"></div>
</div>

<div id="end" class="ov hidden">
  <div id="endLines"></div>
  <div id="endCard" class="hidden"></div>
</div>

<div id="flash"></div>
<div id="warp"></div>
<div id="cgWrap" class="hidden"><div id="cgCaption"><div class="c1">한결중학교 축제 · 2학년 3반 부스</div><div class="c2">서윤의 카드 게임</div></div><div id="cgFrameBox"></div><button id="cgExit">기록으로 돌아가기</button></div>
<div id="warpTxt"></div>
<div id="fade"></div>

<script src="game.js"></script>
</body>
</html>
