<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>폐허의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000; --ash:#141413; --smoke:#2b2a28; --bone:#e7e3da; --dust:#8d8981;
  --red:#c8322d; --blue:#4a7fd4; --yellow:#d8b13a; --nuri:#eaf2ff;
  --serif:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --term:"Nanum Gothic Coding","D2Coding",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--black:#000000;--bone:#e7e3da;}}
:root[data-theme="dark"]{--black:#000000;--bone:#e7e3da;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--black);color:var(--bone);font-family:var(--serif);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.hidden{display:none!important}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
.hud-l{max-width:min(460px,62vw);text-shadow:0 1px 3px #000}
.rec{font-family:var(--term);font-size:12px;color:var(--dust);display:flex;align-items:center;gap:6px}
.rec .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
#areaName{font-size:15px;font-weight:600;margin-top:8px;letter-spacing:.02em}
#objective{font-size:13px;color:#bdb9b0;margin-top:4px;line-height:1.6}
.hud-r{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.hbtn{background:rgba(10,10,10,.78);border:1px solid #3d3b37;padding:8px 13px;font-size:13px;border-radius:2px}
.hbtn:hover{border-color:#77736b}
.hbtn.blue{border-color:var(--blue);color:#b9cff5}
#recCount{font-family:var(--term);color:var(--dust);margin-left:4px}

/* dialog */
#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(740px,94vw);
  background:rgba(8,8,8,.93);border-top:1px solid #4a4843;padding:18px 24px 16px;z-index:8;cursor:pointer}
#dSpk{font-family:var(--term);font-size:12px;color:var(--dust);margin-bottom:8px}
#dTxt{font-size:16px;line-height:1.85;white-space:pre-wrap;min-height:3.6em}
#dCh{display:flex;flex-direction:column;gap:6px;margin-top:12px}
#dCh button{text-align:left;background:transparent;border:1px solid #3d3b37;padding:9px 12px;font-size:14px}
#dCh button:hover{border-color:var(--bone)}
#dNext{position:absolute;right:18px;bottom:10px;font-size:11px;color:var(--dust);animation:blink 1.2s steps(2) infinite}

/* overlays */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
#fade.on{opacity:1}
#flash{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:0}
#flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:rgba(8,8,8,.9);border-left:3px solid var(--bone);
  padding:9px 16px;font-size:14px;z-index:9;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}

/* title */
#title{background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,.35),rgba(0,0,0,.92) 70%);flex-direction:column}
.t-in{text-align:center;max-width:560px}
#title h1{font-size:clamp(46px,11vw,96px);font-weight:900;margin:0;letter-spacing:-.02em;line-height:1.05;position:relative;display:inline-block}
#title h1::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:3px;background:var(--red);transform:rotate(-2deg);opacity:.85}
.t-sub{font-size:17px;color:#c9c5bc;margin:22px 0 34px}
.t-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.t-btns button{background:transparent;border:1px solid var(--bone);padding:12px 26px;font-size:15px}
.t-btns button:hover{background:var(--bone);color:#000}
.acc{margin:26px auto 0;max-width:420px;border:1px solid #33312d;background:rgba(10,10,10,.72);padding:14px 16px;text-align:left}
.acc-k{font-size:14px;font-weight:600}.acc-k b{font-weight:900}
.acc-s{font-size:13px;color:#bdb9b0;line-height:1.7;margin-top:6px}.acc-s.dim{color:var(--dust);font-size:12px}
.acc-row{display:flex;gap:8px;margin-top:10px}
.acc-row input{flex:1;min-width:0;background:#0a0a09;border:1px solid #4a4843;color:var(--bone);font:inherit;font-size:15px;padding:9px 10px;-webkit-user-select:text;user-select:text}
.acc-row input:focus{outline:none;border-color:var(--bone)}
.acc-row button{background:var(--bone);color:#000;border:0;padding:9px 14px;font-size:14px}
.acc-row button:disabled{opacity:.5}
.acc-row.col{flex-direction:column}
.acc-row button.link{background:transparent;color:var(--dust);border:0;padding:2px 0;font-size:13px;text-decoration:underline}
.acc-row button.google{flex:1;background:#fff;color:#1f1f1f;font-weight:600}
.acc-row button.ghost{background:transparent;color:var(--bone);border:1px solid #4a4843}
.t-confirm{flex:1 1 100%;font-size:14px;color:#cfcbc2;line-height:1.7;margin-bottom:6px}
#sync{margin-left:6px}
.t-ctl{font-size:13px;color:var(--dust);margin-top:28px;line-height:1.7}
.t-demo{font-size:12px;color:#66635d;margin-top:10px}
.t-seq{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;gap:26px;text-align:center;padding:20px}
.t-day{font-family:var(--term);font-size:clamp(36px,8vw,64px);letter-spacing:.2em}
.t-q{font-size:19px}
.t-yn{display:flex;gap:14px}
.t-yn button{font-family:var(--term);background:transparent;border:1px solid var(--bone);padding:10px 28px;font-size:15px}
.t-yn button:hover{background:var(--bone);color:#000}

/* archive */
#archive{background:rgba(0,0,0,.72)}
.arc-panel{position:relative;width:min(980px,100%);height:min(700px,100%);background:#0c0c0b;border:1px solid #33312d;display:flex;flex-direction:column;overflow:hidden}
.arc-head{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 22px 12px;border-bottom:1px solid #26241f;gap:10px}
.arc-sys{font-family:var(--term);font-size:12px;color:var(--dust)}
.arc-head h2{margin:4px 0 0;font-size:22px;font-weight:900}
.arc-head .x{background:transparent;border:1px solid #3d3b37;padding:7px 14px;font-size:13px}
.tabs{display:flex;border-bottom:1px solid #26241f}
.tabs button{background:transparent;border:0;padding:11px 20px;font-size:14px;color:var(--dust);border-bottom:2px solid transparent}
.tabs button.on{color:var(--bone);border-bottom-color:var(--bone)}
.arc-body{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
.arc-left{border-right:1px solid #26241f;display:flex;flex-direction:column;min-height:0}
.cmpbar{padding:10px 12px;border-bottom:1px solid #26241f;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmpbar button{background:transparent;border:1px solid #4a4843;padding:6px 11px;font-size:13px}
.cmpbar button.on{border-color:var(--red);color:#f0c4c1}
.cmpbar button:disabled{opacity:.35;cursor:default}
#cmpHint{font-size:12px;color:var(--dust);flex:1 1 100%}
#arcList{overflow:auto;flex:1;padding:6px}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:10px;margin-bottom:2px}
.card:hover{background:#161614}
.card.on{border-color:#4a4843;background:#141412}
.card.sel{border-color:var(--red);background:#1a100f}
.card .d{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--c)}
.card .ct{font-size:14px;font-weight:600;line-height:1.4}
.card .cm{font-size:12px;color:var(--dust);margin-top:2px}
.c-red{--c:var(--red)}.c-blue{--c:var(--blue)}.c-yellow{--c:var(--yellow)}.c-nuri{--c:var(--nuri)}.c-white{--c:#9a968e}
.arc-detail{overflow:auto;padding:26px 30px}
.arc-detail .stripe{width:40px;height:3px;background:var(--c);margin-bottom:16px}
.arc-detail .dm{font-size:13px;color:var(--dust)}
.arc-detail h3{font-size:24px;margin:6px 0 18px;font-weight:900}
.arc-detail p{font-size:15px;line-height:1.95;margin:0 0 14px;max-width:34em;white-space:pre-wrap}
.arc-detail .pastgo{margin-top:8px;background:transparent;border:1px solid var(--blue);color:#b9cff5;padding:10px 16px;font-size:14px}
.empty{color:var(--dust);font-size:14px;line-height:1.8;padding:14px}
.arc-ded{flex:1;overflow:auto;padding:22px 26px}
.arc-ded h4{font-size:15px;margin:0 0 12px;font-weight:600;color:#cfcbc2}
.ded{border-left:2px solid var(--red);padding:4px 0 4px 14px;margin-bottom:16px;max-width:40em}
.ded b{display:block;font-size:15px;margin-bottom:4px}
.ded span{font-size:14px;line-height:1.8;color:#c3bfb6}
.ded.lock{border-left-color:#33312d;color:#57544f}
.esc{display:flex;gap:12px;align-items:baseline;font-size:14px;padding:6px 0;border-bottom:1px solid #1d1c19;max-width:40em}
.esc .m{font-family:var(--term);width:22px}
.esc .a{color:var(--dust);font-size:12px;margin-left:auto}
.cmp-result{position:absolute;inset:0;background:rgba(6,6,6,.96);display:flex;align-items:center;justify-content:center;padding:24px}
.cmp-in{max-width:520px}
.cmp-k{font-size:14px;font-weight:600;color:var(--red)}
.cmp-k.no{color:var(--dust)}
.cmp-in h3{font-size:26px;font-weight:900;margin:8px 0 14px}
.cmp-in p{font-size:15px;line-height:1.95;white-space:pre-wrap}
.cmp-in button{margin-top:10px;background:transparent;border:1px solid var(--bone);padding:10px 22px}
@media (max-width:720px){
  .arc-body{grid-template-columns:1fr;grid-template-rows:minmax(150px,38%) 1fr}
  .arc-left{border-right:0;border-bottom:1px solid #26241f}
  .arc-detail{padding:18px}
  .arc-head{padding:14px 16px 10px}
}

/* keypad */
#keypad{background:rgba(0,0,0,.7)}
.kp{background:#151513;border:1px solid #3d3b37;padding:22px;width:min(320px,100%);text-align:center}
.kp-k{font-family:var(--term);font-size:12px;color:var(--dust)}
.kp-screen{font-family:var(--term);font-size:34px;letter-spacing:.35em;background:#0a0a09;border:1px solid #2c2b27;color:var(--yellow);margin:12px 0 8px;padding:10px 0 10px .35em}
.kp-screen.bad{color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kp-msg{font-size:13px;color:#bdb9b0;min-height:3.2em;line-height:1.6}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.kp-grid button{font-family:var(--term);font-size:20px;background:#1f1e1b;border:1px solid #33312d;padding:12px 0}
.kp-grid button:active{background:#2c2b27}
#kpClose{margin-top:12px;background:transparent;border:0;color:var(--dust);font-size:13px;padding:6px}

/* end */
#end{background:#000;flex-direction:column;text-align:center}
#endLines{font-family:var(--term);font-size:clamp(14px,3.6vw,18px);line-height:2;color:#cfd8e8;min-height:12em;white-space:pre-wrap}
#endLines .g{animation:glitch .18s steps(2) 3}
@keyframes glitch{50%{transform:translateX(4px);color:var(--red)}}
#endCard{max-width:520px}
#endCard h2{font-size:clamp(34px,8vw,56px);font-weight:900;margin:0 0 6px}
#endCard .q{font-size:22px;color:var(--dust);margin-bottom:26px}
#endCard p{font-size:15px;line-height:1.9;color:#c9c5bc}
#endCard .next{margin-top:22px;border-top:1px solid #26241f;padding-top:18px;color:var(--dust);font-size:14px}
#endCard .t-btns{margin-top:26px}
#end.forget{background:#f3f2ed;color:#141414}
#end.truth{background:#05070b}
#end.nuri{background:linear-gradient(120deg,#fbe3ea,#e3f3ec,#e3e9fb,#f8f0dc);color:#2a2a33}
#end.nuri #endLines{font-family:var(--serif);color:#2a2a33;font-size:clamp(15px,3.8vw,19px)}
#end.nuri #endCard p{color:#3a3a44}#end.nuri #endCard .q,#end.nuri #endCard .next{color:#6c6878;border-top-color:#d9d3e6}
#end.nuri .t-btns button,#end.nuri .t-yn button{border-color:#2a2a33;color:#2a2a33}
#end.nuri .t-btns button:hover,#end.nuri .t-yn button:hover{background:#2a2a33;color:#fff}
.nq{font-size:24px;margin-bottom:26px}.nyn{justify-content:center}
#endLines .t-yn{justify-content:center;margin-top:20px}
.t-loop{font-family:var(--term);font-size:13px;color:var(--dust)}
body.bright #hud .hud-l{text-shadow:none;color:#2a2a33}
body.bright #objective{color:#4a4856}
body.bright .rec{color:#6c6878}
body.bright #feed{color:rgba(60,60,80,.65);text-shadow:none}
body.bright #feed div:last-child{color:#2a2a33}
#end.truth #endLines{font-family:var(--serif);color:#dfe6f2;font-size:clamp(15px,3.8vw,19px)}
#end.truth .er{color:#9fb0c8}
#feed{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 62px);width:min(300px,50vw);font-family:var(--term);font-size:11px;line-height:1.65;color:rgba(185,205,235,.62);text-align:right;pointer-events:none;z-index:5;text-shadow:0 1px 2px #000}
#feed .fh{color:var(--red);margin-bottom:2px}
#feed div:last-child{color:#eef3ff}
body.busy #feed{opacity:.35}
#end.forget #endLines{font-family:var(--serif);color:#2a2a28;font-size:clamp(15px,3.8vw,19px)}
#end.forget #endCard p{color:#3a3935}
#end.forget #endCard .q{color:#77746d}
#end.forget #endCard .next{border-top-color:#d6d3cb;color:#77746d}
#end.forget .t-btns button{border-color:#141414}
#end.forget .t-btns button:hover{background:#141414;color:#f3f2ed}
.er-h{font-family:var(--term);font-size:13px;color:var(--red);margin-bottom:14px}
.er-w{max-width:620px;margin:0 auto;line-height:2.1}
.er{display:inline-block;margin:0 10px;transition:opacity .6s,filter .6s;font-size:15px}
.er.gone{opacity:0;filter:blur(3px);text-decoration:line-through}
.fl{animation:fin 1.2s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}

/* touch */
#touch{display:none}
body.playing #touch{display:block}
body.busy #touch{display:none}
#joyzone{position:fixed;left:0;bottom:0;width:min(48vw,300px);height:min(50vh,300px);z-index:4;touch-action:none}
#joyBase{position:fixed;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:128px;height:128px;border-radius:50%;
  border:2px solid rgba(231,227,218,.32);background:radial-gradient(circle,rgba(0,0,0,.15),rgba(0,0,0,.45));z-index:4;pointer-events:none;transition:border-color .15s}
#joyBase.on{border-color:rgba(231,227,218,.7)}
#joyBase::after{content:"";position:absolute;inset:38%;border-radius:50%;border:1px dashed rgba(231,227,218,.18)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(231,227,218,.38);box-shadow:0 2px 10px rgba(0,0,0,.4);transition:transform .08s}
#joyBase.on #joyKnob{transition:none;background:rgba(231,227,218,.6)}
.tbtn{position:fixed;z-index:4;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:84px;height:84px;border-radius:50%;
  background:rgba(10,10,10,.6);border:1px solid rgba(231,227,218,.35);font-size:16px;touch-action:none}
.tbtn.ready{border-color:var(--bone);background:rgba(231,227,218,.18)}
#btnRun{right:calc(122px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:74px;height:74px;border:0;padding:0;font-size:14px;
  background:conic-gradient(var(--bone) calc(var(--st,1) * 360deg),rgba(231,227,218,.14) 0)}
#btnRun span{position:absolute;inset:4px;border-radius:50%;background:rgba(10,10,10,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
#btnRun small{font-size:10px;color:var(--dust)}
#btnRun.on span{background:rgba(60,58,54,.9)}
#btnRun.tired{background:conic-gradient(var(--red) calc(var(--st,1) * 360deg),rgba(231,227,218,.14) 0)}
body.bright #joyBase{border-color:rgba(42,42,51,.3)}
@media (prefers-reduced-motion:reduce){.rec .dot,#dNext{animation:none}#flash.go{animation-duration:.01s}}
</style>
</head>

<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div class="hud-l">
    <div class="rec"><span class="dot"></span>REC <span id="recTime">00:00:00</span><span id="sync"></span></div>
    <div id="areaName"></div>
    <div id="objective"></div>
  </div>
  <div class="hud-r">
    <button id="pastBtn" class="hbtn blue hidden"></button>
    <button id="arcBtn" class="hbtn">기록 보관함<span id="recCount"></span></button>
  </div>
</div>

<div id="dialog" class="hidden"><div id="dSpk"></div><div id="dTxt"></div><div id="dCh"></div><div id="dNext">▼</div></div>
<div id="toast"></div>
<div id="feed" class="hidden"></div>

<div id="touch">
  <div id="joyzone"></div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="btnRun" class="tbtn"><span>달리기<small id="runKey"></small></span></button>
  <button id="btnAct" class="tbtn">조사</button>
</div>

<div id="archive" class="ov hidden">
  <div class="arc-panel">

 S.x=P.x;S.y=P.y;const str=JSON.stringify(Object.assign({},S,{past:false,savedAt:Date.now()}));
 try{localStorage.setItem(KEY,str);}catch(e){}
 if(ACC.state==='ready'&&ACC.profile){cloudPending=str;clearTimeout(cloudTimer);setSync('pending');cloudTimer=setTimeout(flushCloud,1200);}
 else setSync('local');
}
async function flushCloud(){
 if(cloudBusy||!cloudPending||wiped||!ACC.profile)return;
 cloudBusy=true;const str=cloudPending;cloudPending=null;
 try{await ACC.be.saveSet(str);ACC.cloud={state:str};setSync(cloudPending?'pending':'saved');}
 catch(e){
  if(e&&e.code==='unavailable'){if(!cloudPending)cloudPending=str;setSync('retry');setTimeout(()=>{cloudBusy=false;flushCloud();},2000+Math.random()*2000);return;}
  if(e&&e.code==='unauthenticated'){signedOut('로그인이 만료됐어요. 다시 로그인하면 계정 저장이 이어집니다.');}
  else setSync(e&&e.code==='quota_exceeded'?'full':'error');
 }
 cloudBusy=false;if(cloudPending)cloudTimer=setTimeout(flushCloud,800);
}
function parseSave(str){try{const d=typeof str==='string'?JSON.parse(str):str;if(d&&Array.isArray(d.records))return d;}catch(e){}return null;}
function localSave(){try{return parseSave(localStorage.getItem(KEY));}catch(e){return null;}}
function loadSave(){
 const local=localSave();
 const cloud=ACC.cloud?parseSave(ACC.cloud.state):null;
 if(ACC.state==='ready'&&ACC.profile){if(cloud&&local)return (local.savedAt||0)>(cloud.savedAt||0)?local:cloud;return cloud||local;}
 return local;
}
function wipeSave(){
 wiped=true;cloudPending=null;clearTimeout(cloudTimer);
 try{localStorage.removeItem(KEY);}catch(e){}
 ACC.cloud=null;
 if(ACC.state==='ready'&&ACC.profile)return ACC.be.saveDel().catch(()=>{});
 return Promise.resolve();
}
function profUpdate(patch){
 if(ACC.state!=='ready'||!ACC.profile)return;
 Object.assign(ACC.profile,patch);
 profChain=profChain.then(()=>ACC.be.profUpdate(patch)).catch(()=>{});
}
function addEver(id){if(!ACC.profile)return;const ev=ACC.profile.ever||[];if(ev.indexOf(id)<0)profUpdate({ever:ev.concat([id])});}
function addEnding(k){
 if(ACC.profile){const en=ACC.profile.endings||[];if(en.indexOf(k)<0)profUpdate({endings:en.concat([k])});}
 try{const l=JSON.parse(localStorage.getItem('ruins-record-endings')||'[]');if(l.indexOf(k)<0){l.push(k);localStorage.setItem('ruins-record-endings',JSON.stringify(l));}}catch(e){}
}
function localLoops(){try{return +localStorage.getItem('ruins-record-loop')||0;}catch(e){return 0;}}
function localEndings(){try{return JSON.parse(localStorage.getItem('ruins-record-endings')||'[]');}catch(e){return [];}}
function getLoops(){if(ACC.profile&&typeof ACC.profile.loops==='number')return ACC.profile.loops;return localLoops();}
function addLoop(){const n=getLoops()+1;try{localStorage.setItem('ruins-record-loop',String(n));}catch(e){}profUpdate({loops:n});return n-1;}
function setSync(st){
 const el=$('sync');if(!el)return;
 el.textContent={pending:'· 계정에 저장 중',saved:'· 계정에 저장됨',retry:'· 서버 연결 재시도 중',local:'· 이 브라우저에 저장',error:'· 저장 실패 (이 브라우저에만 저장됨)',full:'· 저장 공간 부족'}[st]||'';
}

/* --- ① claude.ai 계정 --- */
async function claudeBackend(){
 if(!window.claude||typeof window.claude.use!=='function')return null;
 const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
 const db=r[0],user=r[1];if(!db||!user)return null;
 const uid=await user.id();if(!uid)return null;
 const profDoc=db.doc('data/users/'+uid+'/profile'),saveDoc=db.doc('data/users/'+uid+'/save');
 const g=await Promise.all([profDoc.get(),saveDoc.get()]);
 return {
  profile:g[0].exists?Object.assign({},g[0].data()):null, cloud:g[1].exists?g[1].data():null,
  be:{
   saveSet:str=>saveDoc.set({state:str,savedAt:Date.now()}),
   saveDel:()=>saveDoc.delete(),
   profUpdate:patch=>profDoc.update(patch),
   create:async name=>{const prof={name,created:Date.now(),loops:localLoops(),ever:(localSave()||{records:[]}).records.slice(),endings:localEndings()};await profDoc.set(prof);return prof;}
  }
 };
}

/* --- ② 직접 만든 서버 --- */
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||'';}catch(e){return '';}}
function setToken(t){try{if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY);}catch(e){}}
async function api(method,path,body,auth){
 const h={'Content-Type':'application/json'};
 if(auth!==false){const t=getToken();if(t)h.Authorization='Bearer '+t;}
 let res;
 try{res=await fetch(SERVER_URL+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});}
 catch(e){throw {code:'unavailable'};}
 let data=null;try{data=await res.json();}catch(e){}
 if(res.ok)return data||{};
 const code=res.status===401?'unauthenticated':res.status===413?'quota_exceeded':(res.status===429||res.status>=500)?'unavailable':((data&&data.error)||'error');
 throw {code,message:data&&data.message};
}
const serverBe={
 saveSet:str=>api('PUT','/api/save',{state:str,savedAt:Date.now()}),
 saveDel:()=>api('DELETE','/api/save'),
 profUpdate:patch=>api('PATCH','/api/profile',patch)
};
async function serverInit(){
 if(!getToken())return {profile:null,cloud:null};
 try{const r=await api('GET','/api/me');return {profile:r.profile||null,cloud:r.save||null};}
 catch(e){if(e.code==='unauthenticated')setToken('');return {profile:null,cloud:null,err:e.code};}
}
async function serverAuth(kind){
 const n=$('accName'),pw=$('accPw'),msg=$('accMsg');
 const name=(n.value||'').trim(),pass=pw.value||'';
 if(!name){msg.textContent='기록자 이름을 적어 주세요.';n.focus();return;}
 if(pass.length<6){msg.textContent='비밀번호는 6자 이상이어야 해요.';pw.focus();return;}
 document.querySelectorAll('#acc button').forEach(b=>b.disabled=true);msg.textContent=kind==='register'?'계정을 만드는 중…':'로그인 중…';
 try{
  const r=await api('POST',kind==='register'?'/api/register':'/api/login',{name,password:pass},false);
  setToken(r.token);ACC.profile=r.profile;ACC.cloud=r.save||null;
  if(kind==='register'){
   const local=localSave();
   const patch={loops:localLoops(),ever:local?local.records.slice():[],endings:localEndings()};
   try{await api('PATCH','/api/profile',patch);Object.assign(ACC.profile,patch);}catch(e){}
   if(local){try{await api('PUT','/api/save',{state:JSON.stringify(local),savedAt:Date.now()});ACC.cloud={state:JSON.stringify(local)};}catch(e){}}
   toast('기록자 '+name+' 계정을 만들었어요. 이제 진행이 서버에 저장됩니다.');
  } else toast('기록자 '+ACC.profile.name+'(으)로 로그인했어요.');
 }catch(e){
  const t={name_taken:'이미 쓰고 있는 기록자 이름이에요.',bad_credentials:'이름 또는 비밀번호가 틀렸어요.',invalid_name:'이름은 1~12자로 적어 주세요.',invalid_password:'비밀번호는 6~72자로 적어 주세요.',unavailable:'서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.'};
  msg.textContent=t[e.code]||e.message||'요청을 처리하지 못했어요.';
  document.querySelectorAll('#acc button').forEach(b=>b.disabled=false);return;
 }
 accountUI();
}
async function serverLogout(){
 try{await api('POST','/api/logout');}catch(e){}
 signedOut('로그아웃했어요. 진행은 이 브라우저에만 저장됩니다.');
}
function signedOut(msg){
 setToken('');ACC.profile=null;ACC.cloud=null;cloudPending=null;clearTimeout(cloudTimer);
 setSync('local');if(msg)toast(msg);accountUI();
}

/* --- ② Firebase --- */
const FB_CFG=(window.RUINS_FIREBASE&&typeof window.RUINS_FIREBASE==='object')?window.RUINS_FIREBASE:null;
let FB=null;
async function loadFirebaseModules(){
 if(window.__RUINS_FB_MODULES)return window.__RUINS_FB_MODULES;
 const base='https://www.gstatic.com/firebasejs/10.12.2/';
 const r=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
 return {app:r[0],auth:r[1],fs:r[2]};
}
const FB_CODES={'unavailable':'unavailable','deadline-exceeded':'unavailable','auth/network-request-failed':'unavailable','unauthenticated':'unauthenticated','permission-denied':'unauthenticated',
 'resource-exhausted':'quota_exceeded','auth/email-already-in-use':'name_taken','auth/invalid-credential':'bad_credentials','auth/invalid-login-credentials':'bad_credentials','auth/wrong-password':'bad_credentials',
 'auth/user-not-found':'bad_credentials','auth/weak-password':'invalid_password','auth/too-many-requests':'rate_limited','auth/unauthorized-domain':'unauthorized_domain','auth/operation-not-allowed':'provider_off',
 'auth/popup-closed-by-user':'cancelled','auth/cancelled-popup-request':'cancelled','auth/popup-blocked':'popup_blocked'};
function fbErr(e){const c=(e&&e.code)||'';return {code:FB_CODES[c]||c||'error'};}
const wrapFb=fn=>async(...a)=>{try{return await fn(...a);}catch(e){throw fbErr(e);}};
async function fbLoadUser(u){
 const fs=FB.fs;FB.pref=fs.doc(FB.db,'users',u.uid);FB.sref=fs.doc(FB.db,'users',u.uid,'data','save');
 const g=await Promise.all([fs.getDoc(FB.pref),fs.getDoc(FB.sref)]);
 ACC.fbUser=u;ACC.profile=g[0].exists()?Object.assign({},g[0].data()):null;ACC.cloud=g[1].exists()?g[1].data():null;
}
const fbBe={
 saveSet:wrapFb(str=>FB.fs.setDoc(FB.sref,{state:str,savedAt:Date.now()})),
 saveDel:wrapFb(()=>FB.fs.deleteDoc(FB.sref)),
 profUpdate:wrapFb(patch=>FB.fs.updateDoc(FB.pref,patch)),
 create:wrapFb(async name=>{const prof={name,created:Date.now(),loops:localLoops(),ever:(localSave()||{records:[]}).records.slice(),endings:localEndings()};await FB.fs.setDoc(FB.pref,prof);return prof;})
};
async function firebaseInit(){
 const m=await loadFirebaseModules();
 const app=m.app.initializeApp(FB_CFG);
 FB={m,auth:m.auth.getAuth(app),db:m.fs.getFirestore(app),fs:m.fs};
 try{FB.auth.languageCode='ko';}catch(e){}
 const u=await new Promise(res=>{const un=m.auth.onAuthStateChanged(FB.auth,x=>{un();res(x);});});
 if(u){try{await fbLoadUser(u);}catch(e){ACC.fbUser=u;ACC.profile=null;ACC.serverDown=true;}}
}
const AUTH_MSG={name_taken:'이미 가입된 이메일이에요. 로그인해 주세요.',bad_credentials:'이메일 또는 비밀번호가 틀렸어요.',invalid_password:'비밀번호는 6자 이상이어야 해요.',invalid_email:'이메일 형식이 올바르지 않아요.',
 rate_limited:'시도가 너무 많아요. 잠시 후 다시 해 주세요.',unavailable:'서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.',unauthorized_domain:'이 주소가 Firebase의 승인된 도메인에 없어요. 콘솔에서 추가해 주세요.',
 provider_off:'Firebase 콘솔에서 이 로그인 방법을 켜 주세요.',popup_blocked:'팝업이 차단됐어요. 팝업을 허용하고 다시 눌러 주세요.',user_disabled:'사용이 중지된 계정이에요.'};
FB_CODES['auth/invalid-email']='invalid_email';FB_CODES['auth/missing-email']='invalid_email';FB_CODES['auth/missing-password']='invalid_password';FB_CODES['auth/user-disabled']='user_disabled';
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let fbForm='login';
async function fbAuth(kind){
 const msg=$('accMsg');
 let email='',pass='',name='';
 if(kind!=='google'){
  email=($('accEmail').value||'').trim();pass=$('accPw').value||'';
  if(kind==='register'){name=($('accName').value||'').trim();
   if(!name||name.length>12){msg.textContent='기록자 이름은 1~12자로 적어 주세요.';$('accName').focus();return;}}
  if(!EMAIL_RE.test(email)){msg.textContent='이메일을 정확히 적어 주세요.';$('accEmail').focus();return;}
  if(pass.length<6){msg.textContent='비밀번호는 6자 이상이어야 해요.';$('accPw').focus();return;}
  if(kind==='register'&&pass!==($('accPw2').value||'')){msg.textContent='비밀번호 확인이 일치하지 않아요.';$('accPw2').focus();return;}
 }
 const btns=document.querySelectorAll('#acc button');btns.forEach(b=>b.disabled=true);
 msg.textContent=kind==='register'?'계정을 만드는 중…':'로그인 중…';
 try{
  const A=FB.m.auth;
  if(kind==='google')await A.signInWithPopup(FB.auth,new A.GoogleAuthProvider());
  else if(kind==='register'){const cred=await A.createUserWithEmailAndPassword(FB.auth,email,pass);
   try{if(A.sendEmailVerification)await A.sendEmailVerification((cred&&cred.user)||FB.auth.currentUser);}catch(e){}}
  else await A.signInWithEmailAndPassword(FB.auth,email,pass);
  await fbLoadUser(FB.auth.currentUser);
  if(!ACC.profile&&kind==='register'){
   ACC.profile=await fbBe.create(name);
   const local=localSave();if(local){try{await fbBe.saveSet(JSON.stringify(local));ACC.cloud={state:JSON.stringify(local)};}catch(e){}}
   toast('기록자 '+name+' 계정을 만들었어요. '+email+'로 인증 메일을 보냈어요.');
  } else if(ACC.profile)toast('기록자 '+ACC.profile.name+'(으)로 로그인했어요.');
 }catch(e){
  const er=(e&&e.code&&FB_CODES[e.code])?fbErr(e):(e&&e.code&&e.code.indexOf('/')<0?e:fbErr(e));
  btns.forEach(b=>b.disabled=false);
  msg.textContent=er.code==='cancelled'?'':(AUTH_MSG[er.code]||'로그인하지 못했어요. ('+er.code+')');
  return;
 }
 fbForm='login';accountUI();
}
async function fbReset(){

 try{await FB.m.auth.sendPasswordResetEmail(FB.auth,email);msg.textContent=email+'로 비밀번호 재설정 메일을 보냈어요. 메일함(스팸함 포함)을 확인해 주세요.';}
 catch(e){const er=fbErr(e);msg.textContent=AUTH_MSG[er.code]||'메일을 보내지 못했어요. ('+er.code+')';}

async function fbLogout(){try{await FB.m.auth.signOut(FB.auth);}catch(e){}ACC.fbUser=null;signedOut('로그아웃했어요. 진행은 이 브라우저에만 저장됩니다.');}

async function initAccount(){

function tile(x,y){
 const m=MAPS[S.area];
 if(x<0||y<0||x>=m.w||y>=m.h)return '#';
 const t=m.g[y][x];
 if(S.area==='city'){if(t==='G'&&S.flags.gateOpen)return 'g';return t;}
 if(S.area==='nl'){if(t==='h')return S.flags.roadOpen?'N':'V';return t;}
 if(S.area==='lab'){if(t==='J')return S.flags.restored?'j':'J';if(t==='Q')return S.flags.codeOK?'q':'Q';return t;}
 if(S.area==='factory'){if(t==='L')return S.flags.power?'l':'L';if(t==='K')return S.flags.power?'k':'K';return t;}
 if(x===18&&y===15)return S.past?'M':(S.flags.cleared?'H':'r');
 if(!S.past&&RUBBLE_S.has(x+','+y))return 'r';
 return t;
}

function objs(){
 return OBJ[S.area].filter(o=>{
  if(o.when==='present'&&S.past)return false;
  if(o.when==='past'&&!S.past)return false;
  if(o.show&&!o.show())return false;
  return true;
 });
}
function solidAt(tx,ty){
 if(SOLID.has(tile(tx,ty)))return true;
 const l=objs();for(let i=0;i<l.length;i++){const o=l[i];if(o.solid&&o.y===ty&&tx>=o.x&&tx<o.x+(o.w||1))return true;}
 return false;
}
function hit(x,y){
 const pts=[[x-7,y-7],[x+7,y-7],[x-7,y+1],[x+7,y+1]];
 return pts.some(p=>solidAt(Math.floor(p[0]/TS),Math.floor(p[1]/TS)));
}
function unstuck(){
 if(!hit(P.x,P.y))return;
 const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);
 for(let r=1;r<7;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
  const nx=(tx+dx+.5)*TS,ny=(ty+dy+.6)*TS;
  if(!hit(nx,ny)){P.x=nx;P.y=ny;return;}
 }
 const sp={city:[5.5,27.6],school:[27,24.2],factory:[19,26.6],lab:[18,3.4],nl:[6,21.5]}[S.area];
 if(sp){P.x=sp[0]*TS;P.y=sp[1]*TS;}
}
function findNear(){
 let best=null,bd=1e9;const cx=P.x,cy=P.y-8;
 objs().forEach(o=>{const ox=(o.x+(o.w||1)/2)*TS,oy=(o.y+.5)*TS;const d=Math.hypot(ox-cx,oy-cy);if(d<TS*1.35&&d<bd){bd=d;best=o;}});
 return best;
}

let dlg=null,typeTimer=null;
const dEl=$('dialog'),dSpk=$('dSpk'),dTxt=$('dTxt'),dCh=$('dCh'),dNext=$('dNext');
function say(pages,onDone){
 pages=pages.map(p=>typeof p==='string'?{t:p}:p);
 dlg={pages,i:0,onDone,typing:false};showPage();document.body.classList.add('busy');
}
function showPage(){
 const p=dlg.pages[dlg.i];
 dEl.classList.remove('hidden');
 dSpk.textContent=p.s||'';dSpk.style.display=p.s?'block':'none';
 dCh.innerHTML='';dNext.style.visibility='hidden';
 const txt=p.t;let n=0;dlg.typing=true;dTxt.textContent='';
 clearInterval(typeTimer);
 typeTimer=setInterval(()=>{n+=2;dTxt.textContent=txt.slice(0,n);if(n>=txt.length)finishType();},28);
}
function finishType(){
 clearInterval(typeTimer);if(!dlg)return;
 const p=dlg.pages[dlg.i];dTxt.textContent=p.t;dlg.typing=false;
 if(p.c){p.c.forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+c.l;b.onclick=e=>{e.stopPropagation();pick(i);};dCh.appendChild(b);});}
 else dNext.style.visibility='visible';
}
function pick(i){
 if(!dlg||dlg.typing)return;const p=dlg.pages[dlg.i];if(!p.c||!p.c[i])return;
 const f=p.c[i].f;closeDlg();if(f)f();
}
function closeDlg(){clearInterval(typeTimer);dlg=null;dEl.classList.add('hidden');refreshBusy();}
function advance(){
 if(!dlg)return;if(dlg.typing){finishType();return;}
 const p=dlg.pages[dlg.i];if(p.c)return;
 dlg.i++;
 if(dlg.i>=dlg.pages.length){const d=dlg.onDone;closeDlg();if(d)d();}else showPage();
}
dEl.addEventListener('click',advance);
function refreshBusy(){document.body.classList.toggle('busy',busy());document.body.classList.toggle('playing',started);}

/* 키 이름 통일: 한글 입력 상태(ㅈㅁㄴㅇ)나 대문자여도 WASD가 동작하도록 실제 키 위치(e.code) 기준으로 읽음 */
const HANGUL_KEY={'ㅈ':'w','ㅉ':'w','ㅁ':'a','ㄴ':'s','ㅇ':'d','ㄷ':'e','ㄸ':'e','ㄹ':'f','ㄱ':'r','ㄲ':'r','ㅂ':'q','ㅃ':'q'};
function normKey(e){
 const c=e.code||'';
 if(/^Key[A-Z]$/.test(c))return c.slice(3).toLowerCase();
 if(/^Digit[0-9]$/.test(c))return c.slice(5);
 if(/^Numpad[0-9]$/.test(c))return c.slice(6);
 if(c==='Space')return ' ';
 if(c==='ShiftLeft'||c==='ShiftRight')return 'shift';
 if(c==='Enter'||c==='NumpadEnter')return 'enter';
 const k=(e.key||'').toLowerCase();
 return HANGUL_KEY[k]||k;
}
window.addEventListener('keydown',e=>{
 const k=normKey(e);
 if(k==='tab'){e.preventDefault();if(arcOpen)closeArchive();else openArchive();return;}
 if(kpOpen){if(/^[0-9]$/.test(k))kpPress(k);else if(k==='backspace')kpPress('back');else if(k==='enter')kpPress('ok');else if(k==='escape')closeKeypad();return;}
 if(k==='escape'){if(arcOpen)closeArchive();return;}
 if(dlg){
  if(e.repeat)return;
  const p=dlg.pages[dlg.i];
  if(p.c&&!dlg.typing&&/^[1-9]$/.test(k)){pick(+k-1);return;}
  if(k==='e'||k===' '||k==='enter'){e.preventDefault();advance();}
  return;
 }
 if(arcOpen)return;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0)e.preventDefault();
 keys[k]=true;
 if(e.repeat)return;
 if(k==='e'||k===' '||k==='enter')action();
 if(k==='f')togglePast();
});

function update(dt){
 if(started&&!endOpen)S.time+=dt;
 if(busy()){P.moving=false;P.running=false;P.vx=P.vy=0;near=null;return;}
 let vx=0,vy=0,mag=0;
 if(keys['a']||keys['arrowleft'])vx-=1;if(keys['d']||keys['arrowright'])vx+=1;
 if(keys['w']||keys['arrowup'])vy-=1;if(keys['s']||keys['arrowdown'])vy+=1;
 if(vx||vy){const l=Math.hypot(vx,vy);vx/=l;vy/=l;mag=1;}
 if(joy.len>.12){const l=Math.hypot(joy.dx,joy.dy)||1;vx=joy.dx/l;vy=joy.dy/l;mag=Math.min(1,joy.len);}
 const wantRun=(keys['shift']||runHeld)&&mag>0;
 if(wantRun&&!P.tired&&P.sta>0){P.running=true;P.sta=Math.max(0,P.sta-dt*.36);if(P.sta<=0)P.tired=true;}
 else{P.running=false;P.sta=Math.min(1,P.sta+dt*(mag>0?.2:.34));if(P.tired&&P.sta>.35)P.tired=false;}
 const top=(P.running?210:122)*Math.max(.45,mag);
 const k=1-Math.exp(-dt*(mag>0?(P.running?8:11):15));
 P.vx+=(vx*(mag>0?top:0)-P.vx)*k;P.vy+=(vy*(mag>0?top:0)-P.vy)*k;
 const spd=Math.hypot(P.vx,P.vy);
 const ox=P.x,oy=P.y;
 if(spd>3){
  const nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
  if(!hit(nx,P.y))P.x=nx;else P.vx*=.3;
  if(!hit(P.x,ny))P.y=ny;else P.vy*=.3;
  if(mag>0){P.fx=vx;P.fy=vy;
   if(Math.abs(vx)>Math.abs(vy)*1.15)P.face=vx>0?'r':'l';else if(Math.abs(vy)>Math.abs(vx)*1.15)P.face=vy>0?'d':'u';}
 } else {P.vx=P.vy=0;}
 const moved=Math.hypot(P.x-ox,P.y-oy);
 P.moving=moved>.05;
 const ww=P.moving?Math.min(1,moved/dt/90):0;
 P.walkW+=(ww-P.walkW)*(1-Math.exp(-dt*(ww>P.walkW?9:12)));
 P.runW+=((P.running&&P.moving?1:0)-P.runW)*(1-Math.exp(-dt*6));
 const stepLen=36+10*P.runW;
 const prev=P.phase;
 if(P.moving)P.phase+=moved*Math.PI/stepLen;
 else if(P.walkW>.02){const tgt=Math.round(P.phase/Math.PI)*Math.PI;P.phase+=(tgt-P.phase)*(1-Math.exp(-dt*10));}
 P.anim=P.phase;
 if(P.runW>.5)for(const off of [0,Math.PI]){if(Math.cos(prev+off)>0&&Math.cos(P.phase+off)<=0){
  const sx=P.face==='l'?-1:P.face==='r'?1:0;DUST.push({x:P.x+(off?-2:2)*(sx?0:1)+sx*Math.sin(P.phase+off)*7,y:P.y+1,t:0});}}
 rb.style.setProperty('--st',P.sta.toFixed(3));rb.classList.toggle('tired',P.tired);
 if(S.area==='city'&&S.flags.gateOpen&&P.y<TS*.9)goArea('school',27*TS,24.2*TS);
 else if(S.area==='school'&&P.y>TS*25.2)goArea('city',20*TS,1.9*TS);
 else if(S.area==='factory'&&P.y>TS*28.2)goArea('school',18.5*TS,19.7*TS);
 else if(S.area==='lab'&&P.y<TS*1.9)goArea('factory',28.5*TS,24.9*TS);
 if(S.area==='nl'){
  let w=0;const onSt=P.y>18*TS&&P.y<21*TS;if(onSt&&P.x>27.5*TS&&P.x<29*TS){P.x=.7*TS;w=1;}else if(onSt&&P.x<.5*TS){P.x=27.3*TS;w=1;}
  if(w){S.flags.loops=(S.flags.loops||0)+1;const n=S.flags.loops;alog('USER 이동 · 같은 거리 '+n+'회');
   toast(n===1?'…다시 같은 거리다.':n===2?'계속 걸어도 같은 장소로 돌아온다.':'이 길은 어디로도 이어지지 않는다. 다른 길을 찾아야 한다.',COL.nuri);}
  if(!S.flags.centerIntro&&roomLabel()==='중심부'){S.flags.centerIntro=1;save();
   say(['길 끝에, 하얀 빛이 숨 쉬는 광장이 있었다.','서른 개의 의자가 빛을 향해 놓여 있다. 모두 비어 있다.','누리느엘의 중심부다.']);}
 }
 if(S.flags.archiveOn){
  if(P.moving){stepAcc+=120*dt;idleT=0;idleLogged=false;S.steps=(S.steps||0)+120*dt/20;if(stepAcc>TS*12){stepAcc=0;alog('USER 이동 · 누적 '+Math.floor(S.steps)+'걸음');}}
  else{idleT+=dt;if(idleT>6&&!idleLogged){idleLogged=true;alog('USER 정지 · 망설임 '+Math.floor(idleT)+'초');}}
  const rl=roomLabel();if(rl!==lastRoom){if(lastRoom)alog('USER 위치 · '+rl);lastRoom=rl;}
 }
 near=findNear();
 $('btnAct').classList.toggle('ready',!!near);
}

 });
 let rad,dark;

 }
 if(S.area==='lab'){

 vis.forEach(o=>{let c=objGlowColor(o);if(!c)return;if(S.area==='nl'&&c===COL.nuri)c='#9d7ae6';const cx=(o.x+(o.w||1)/2)*TS,cy=(o.y+.5)*TS-(o.tall?8:0);

 if(near&&!busy()){
